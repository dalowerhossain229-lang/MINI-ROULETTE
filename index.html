<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MINI ROULETTE - ROYAL WHEEL MASTER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header" style="display:none !important;">
        <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
    </div>

    <!-- 🎡 ওরিজিনাল ক্যাসিনো ৩ডি রুলেট চাকা শোডাউন জোন -->
    <div class="roulette-wheel-container">
        <div class="wheel-pointer-arrow">▼</div>
        <div class="roulette-wheel-plate" id="roulette-wheel-plate-node">
            <img src="wheel.png" id="wheel-img-asset" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
    </div>

    <!-- 💸 বাজি ধরার প্রধান ৩টি নিয়ন মডিউল (RED, ZERO, BLACK ওডস লক ভাই ভাই) -->
    <div class="betting-board">
        <button class="bet-board-btn red-select-btn" id="board-RED" onclick="selectBetSide('RED')">
            <span class="board-label">RED (লাল) 🔴</span>
            <span class="board-odds">x2.00</span>
        </button>

        <button class="bet-board-btn zero-select-btn" id="board-ZERO" onclick="selectBetSide('ZERO')">
            <span class="board-label">ZERO (০) 🟢</span>
            <span class="board-odds">x12.00</span>
        </button>

        <button class="bet-board-btn black-select-btn" id="board-BLACK" onclick="selectBetSide('BLACK')">
            <span class="board-label">BLACK (কালো) ⚫</span>
            <span class="board-odds">x2.00</span>
        </button>
    </div>

    <!-- 📢 উইন-লস লাইভ ক্যাসিনো মেসেজ প্যানেল বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">লাল, কালো বা জিরো চুজ করে SPIN বোতাম চাপুন ভাই!</span>
    </div>

    <!-- 🎛️ অ্যাকশন কন্ট্রোল ফুটার প্যানেল বার -->
    <div class="footer-controls">
        <div class="play-section">
            <button class="bet-btn-nav" onclick="adjustBet('minus')">-</button>
            <div style="text-align: center; width: 60px;">
                <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳50</div>
            </div>
            <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>

            <button class="play-btn" id="spin-btn" onclick="handleRouletteSpin()">SPIN</button>
            
            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🤖</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50;
        let selectedSide = null;
        let isSpinning = false;
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        // 🎡 ওরিজিনাল স্ক্রিনশটের ১২ স্লট চাকা অনুযায়ী ১ মিলিমিটার নিখুঁত ডিগ্রী অ্যারে ম্যাপিং লক ওস্তাদ!
        const rouletteSlotsDegreeMapping = {
            34: 0,    9: 27.7,  27: 55.4, 13: 83.1, 
            0: 110.8, 32: 138.5, 15: 166.2, 19: 193.9, 
            4: 221.6, 21: 249.3, 2: 277,    25: 304.7, 17: 332.4
        };

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 50) currentBet -= 50;
            if (action === 'plus' && currentBet < 20000) currentBet += 50;
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function selectBetSide(side) {
            if (isSpinning) return;
            selectedSide = side; 
            document.getElementById("board-RED").classList.remove("active-side-bet");
            document.getElementById("board-ZERO").classList.remove("active-side-bet");
            document.getElementById("board-BLACK").classList.remove("active-side-bet");
            document.getElementById(`board-${side}`).classList.add("active-side-bet");
            playAudio('click');
        }

        function animateRouletteWheelSpinning(serverGameData) {
            const wheelPlate = document.getElementById("roulette-wheel-plate-node");
            if (!wheelPlate) return;

            let finalWinningNumber = serverGameData.winningNumber || 0;
            let baseTargetDegree = rouletteSlotsDegreeMapping[finalWinningNumber] || 0;

            let totalTargetRotationAngle = 1800 + (360 - baseTargetDegree);

            wheelPlate.style.transition = "transform 3.5s cubic-bezier(0.1, 0.8, 0.1, 1)";
            wheelPlate.style.transform = `rotate(${totalTargetRotationAngle}deg)`;
            playAudio('spin');

            setTimeout(() => {
                wheelPlate.style.transition = "none";
                wheelPlate.style.transform = `rotate(${360 - baseTargetDegree}deg)`;

                // তাজা ওরিজিনাল ফাইনাল ব্যালেন্স গ্লোবাল মেমরিতে সেভ লক ওস্তাদ!
                if(serverGameData.balance !== undefined) {
                    balance = parseFloat(serverGameData.balance);
                }
                showFinalRouletteReward(serverGameData.status, serverGameData.winAmount, finalWinningNumber, serverGameData.winningColor);
            }, 3650);
        }

        async function handleRouletteSpin() {
            if (isSpinning || isSpinning === true) return; 
            if (!selectedSide) {
                alert("🔒 বাজি প্লে করার আগে RED, BLACK বা ZERO সিলেক্ট করুন ওস্তাদ!");
                return;
            }

            isSpinning = true;
            if (document.getElementById("spin-btn")) document.getElementById("spin-btn").disabled = true;
            if (document.getElementById("win-status-box")) document.getElementById("win-status-box").className = "win-status-container";
            if (document.getElementById("win-text-msg")) document.getElementById("win-text-msg").innerText = "🎰 চাকা ঘুরছে, রিওয়ার্ড গণনার অপেক্ষা ওস্তাদ...";
            playAudio('click');

            try {
                const response = await fetch(`${SERVER_URL}/api/roulette-deal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId, amount: parseFloat(currentBet), wallet: urlWallet, prediction: selectedSide
                    })
                });

                const serverRes = await response.json();
                
                if (serverRes.success || serverRes.success === true) {
                    let parsedLiveBalance = serverRes.balance || serverRes.data?.balance || balance;
                    balance = parseFloat(parsedLiveBalance);
                    
                    let targetGamePayload = serverRes.gameData || serverRes;
                    animateRouletteWheelSpinning(targetGamePayload);
                } else {
                    alert(serverRes.message || "❌ Insufficient Balance! Please Recharge Wallet.");
                    stopRouletteState();
                }
            } catch (err) {
                stopRouletteState();
            }
        }

        function showFinalRouletteReward(status, winAmount, winNum, winColor) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");
            
            let displayColorBengali = winColor === "RED" ? "লাল 🔴" : (winColor === "BLACK" ? "কালো ⚫" : "জিরো 🟢");

            if (status === "win") {
                playAudio('win');
                if (msgBox) msgBox.className = "win-status-container win-glow-bar";
                if (textMsg) textMsg.innerHTML = `🎉 গ্র্যান্ড উইন ওস্তাদ! চাকা <b>${winNum} [${displayColorBengali}]</b> এ থেমেছে। ওয়ালেটে ৳${winAmount} ক্রেডিট হয়েছে ভাই ভাই!`;
            } else {
                playAudio('wheel');
                if (msgBox) msgBox.className = "win-status-container lose-glow-bar";
                if (textMsg) textMsg.innerHTML = `💥 ওহ হো লস! চাকা <b>${winNum} [${displayColorBengali}]</b> এ থেমেছে। আবার অন ফায়ার ট্রাই করুন ওস্তাদ!`;
            }

            // 🎯 [মেগা ইনস্ট্যান্ট রিফ্রেশার ট্রিক]: চাকা থামা মাত্রই ১ মিলি-সেকেন্ডে চোখের পলকে ব্যালেন্স ইনস্ট্যান্ট আপডেট!
            if (typeof balance !== 'undefined' && !isNaN(balance)) {
                if (document.getElementById("user-balance")) {
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            }

            setTimeout(() => { fetchLiveBalance(); }, 1500);
            stopRouletteState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleRouletteSpin();
                }, 3500);
            }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (data.balance !== undefined) {
                        balance = parseFloat(data.balance);
                        if (document.getElementById("user-balance")) {
                            document.getElementById("user-balance").innerText = balance.toFixed(2);
                        }
                    }
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/roulette-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const serverData = await response.json();
                if (serverData.success || serverData.balance !== undefined) {
                    balance = parseFloat(serverData.balance);
                    if (document.getElementById("user-balance")) {
                        document.getElementById("user-balance").innerText = balance.toFixed(2);
                    }
                }
            } catch (e) { console.error("Balance background layer sync check"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
        };

        function toggleAuto() {
            isAuto = !isAuto;
            const autoEl = document.getElementById("auto-btn");
            if (autoEl) autoEl.classList.toggle('active', isAuto);
            if (isAuto && !isSpinning) handleRouletteSpin();
            playAudio('click');
        }

        function stopRouletteState() {
            isSpinning = false;
            if (document.getElementById("spin-btn")) document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        const slotSounds = {
            click: new Audio('spin2.mp3'), spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3'), wheel: new Audio('spin2.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) {
            try { slotSounds[type].currentTime = 0; slotSounds[type].play(); } catch(e) {}
        }
    </script>
</body>
</html>
